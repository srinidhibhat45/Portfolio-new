<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="../diagram.css"><meta name="diagram-size" content="1600x580">
<style>.lane{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:center}.lane h2{font-size:27px;font-weight:600}.chip{padding:14px 20px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:23px;font-weight:500;white-space:nowrap}.chip.end{background:var(--wash);border-color:var(--accent);color:var(--accent)}</style>
<p class="kicker">Three everyday tasks</p><h1>Every task starts from the class</h1>
<div class="grow col" style="gap:30px;justify-content:center">
<div class="lane"><h2>Find a file</h2><div class="row" style="gap:12px"><span class="chip">Your spaces</span><span class="arrow">→</span><span class="chip">The class</span><span class="arrow">→</span><span class="chip">Files</span><span class="arrow">→</span><span class="chip end">Sort, filter or starred</span></div></div>
<div class="lane"><h2>Catch an announcement</h2><div class="row" style="gap:12px"><span class="chip">Your spaces</span><span class="arrow">→</span><span class="chip">The class</span><span class="arrow">→</span><span class="chip">Announcements</span><span class="arrow">→</span><span class="chip end">General or Mentions</span></div></div>
<div class="lane"><h2>Join a class call</h2><div class="row" style="gap:12px"><span class="chip">Your spaces</span><span class="arrow">→</span><span class="chip">The class</span><span class="arrow">→</span><span class="chip">Its channel</span><span class="arrow">→</span><span class="chip end">Call button in the header</span></div></div>
</div>
